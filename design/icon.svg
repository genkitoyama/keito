<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- keito app icon: three devices wired together, on the macOS icon grid (824 px body, 100 px margin). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c8c"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <pattern id="grid" width="41.2" height="41.2" patternUnits="userSpaceOnUse" x="100" y="100">
      <circle cx="20.6" cy="20.6" r="2.4" fill="#ffffff" opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#grid)"/>
  <g transform="translate(-18 21)">
  <g fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- LAN (orange) from the left box down and across to the bottom box -->
    <path d="M302 418 V560 Q302 600 342 600 H470" stroke="#f59e0b"/>
    <!-- HDMI (blue) from the left box across to the right box -->
    <path d="M410 330 H560 Q600 330 600 370 V398 Q600 438 640 438 H660" stroke="#60a5fa"/>
    <!-- USB (teal) from the bottom box up to the right box -->
    <path d="M690 640 H740 Q780 640 780 600 V540" stroke="#2dd4bf"/>
  </g>
  <g filter="url(#shadow)">
    <!-- left device -->
    <rect x="200" y="262" width="210" height="156" rx="22" fill="#ffffff"/>
    <rect x="200" y="262" width="210" height="44" rx="22" fill="#dbe7fb"/>
    <rect x="200" y="284" width="210" height="22" fill="#dbe7fb"/>
    <!-- right device -->
    <rect x="660" y="380" width="200" height="160" rx="22" fill="#ffffff"/>
    <rect x="660" y="380" width="200" height="44" rx="22" fill="#dbe7fb"/>
    <rect x="660" y="402" width="200" height="22" fill="#dbe7fb"/>
    <!-- bottom device -->
    <rect x="470" y="560" width="220" height="160" rx="22" fill="#ffffff"/>
    <rect x="470" y="560" width="220" height="44" rx="22" fill="#dbe7fb"/>
    <rect x="470" y="582" width="220" height="22" fill="#dbe7fb"/>
  </g>
  <!-- ports where the lines meet the boxes -->
  <g>
    <circle cx="410" cy="330" r="13" fill="#60a5fa"/>
    <circle cx="302" cy="418" r="13" fill="#f59e0b"/>
    <circle cx="660" cy="438" r="13" fill="#60a5fa"/>
    <circle cx="470" cy="600" r="13" fill="#f59e0b"/>
    <circle cx="690" cy="640" r="13" fill="#2dd4bf"/>
    <circle cx="780" cy="540" r="13" fill="#2dd4bf"/>
  </g>
  <!-- name lines in each box -->
  <g fill="#94a3b8">
    <rect x="232" y="338" width="110" height="14" rx="7"/>
    <rect x="232" y="366" width="74" height="14" rx="7"/>
    <rect x="692" y="456" width="104" height="14" rx="7"/>
    <rect x="692" y="484" width="70" height="14" rx="7"/>
    <rect x="502" y="636" width="116" height="14" rx="7"/>
    <rect x="502" y="664" width="78" height="14" rx="7"/>
  </g>
  </g>
</svg>
